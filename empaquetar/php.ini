; =====================================================================
;  TiendaWeb - php.ini de la app de escritorio (PHP Desktop)
;  ${LOCALAPPDATA} lo expande PHP con la variable de entorno de Windows.
; =====================================================================

; Extensiones (solo las que usa el sistema)
extension_dir = "ext/"
extension=php_mbstring.dll
extension=php_pdo_sqlite.dll
extension=php_openssl.dll
; FFI: imprimir tickets en modo RAW con la API de impresión de Windows (winspool)
extension=php_ffi.dll
ffi.enable = true

; Fecha
date.timezone = America/Mexico_City

; Errores: nunca en pantalla, siempre en el registro
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "${LOCALAPPDATA}\TiendaWeb\errores-php.log"

; General
short_open_tag = Off
output_buffering = 4096
default_charset = "UTF-8"
max_execution_time = 60
memory_limit = 256M

; Subir respaldos para restaurarlos
file_uploads = On
max_file_uploads = 5
upload_max_filesize = 512M
post_max_size = 512M

; Sesiones
session.save_path = "${LOCALAPPDATA}\TiendaWeb\sesiones"
session.gc_maxlifetime = 86400
